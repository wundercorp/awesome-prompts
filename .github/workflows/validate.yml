name: Validate awesome-prompts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run validate
      - run: npm run generate:readme
      - run: git diff --exit-code README.md
      - name: Require demo URL for new prompt submissions
        if: github.event_name == 'pull_request'
        run: node scripts/validate-pr-submissions.mjs "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
